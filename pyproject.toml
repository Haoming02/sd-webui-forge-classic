[project]
name = "ForgeNeo"
version = "2"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "~=3.13"

[project.urls]
repository = "https://github.com/Haoming02/sd-webui-forge-classic/tree/neo"

[tool.black]
line-length = 1024

[tool.ruff]
target-version = "py313"
exclude = ["extensions", "extensions-builtin/forge_legacy_preprocessors"]
lint.select = ["N805", "S102", "S307", "E", "F", "I", "T", "W"]
lint.ignore = ["E402", "E501", "E731", "E741", "T201"]
